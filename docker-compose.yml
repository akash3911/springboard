version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lab-equipment-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: labportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: lab-equipment-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: lab-equipment-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend